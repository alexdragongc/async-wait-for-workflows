name: Run after CI A and CI B

on:
  workflow_run:
    #https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run
    # This fires after either workflow from the list fires its workflow event
    # (in that case, "complete"). Meaning: this is an OR rule. To make an AND
    # rule, we need to check the status of all the dependencies from the list.
    workflows: ["CI A", "CI B"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Hello world
        run: echo "Hello, world!"

      - name: Dump event data
        run: |
          echo "calling commit: ${{ toJson(github.event.workflow_run.head_sha) }}"
          echo "calling workflow: ${{ toJson(github.event.workflow_run.workflow) }}"
          echo "calling run_id: ${{ toJson(github.event.workflow_run.run_id) }}"

      - name: Get workflow dependencies
        id: workflow_dependencies
        run: |
          # Extract path from "owner/repo/.github/workflows/file.yml@refs/heads/main"
          WORKFLOW_PATH="${GITHUB_WORKFLOW_REF#*/}"   # strip "owner/"
          WORKFLOW_PATH="${WORKFLOW_PATH#*/}"         # strip "repo/"
          WORKFLOW_PATH="${WORKFLOW_PATH%@*}"         # strip "@ref"

          WORKFLOWS=$(yq -o=json '.on.workflow_run.workflows' "$WORKFLOW_PATH")
          echo "list=$WORKFLOWS" >> $GITHUB_OUTPUT

      - name: Dump workflow dependencies
        run: |
          echo "workflow dependencies: ${{ toJson(steps.workflow_dependencies.outputs.list) }}"
