name: Run after CI A and CI B

on:
  workflow_run:
    #https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run
    # This fires after either workflow from the list fires its workflow event
    # (in that case, "complete"). Meaning: this is an OR rule. To make an AND
    # rule, we need to check the status of all the dependencies from the list.
    workflows: ["CI A", "CI B"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  check-workflow-dependencies:
    runs-on: ubuntu-latest
    outputs:
      all_completed: ${{ steps.check_deps.outputs.all_completed }}
      all_passed: ${{ steps.check_deps.outputs.all_passed }}
      workflow_statuses: ${{ steps.check_deps.outputs.workflow_statuses }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Log target commit
        run: |
          echo "Calling workflow for target commit: ${{ toJson(github.event.workflow_run.head_sha) }}"

      - name: Get workflow dependencies
        id: workflow_dependencies
        run: |
          # Extract path from "owner/repo/.github/workflows/file.yml@refs/heads/main"
          WORKFLOW_PATH="${GITHUB_WORKFLOW_REF#*/}"   # strip "owner/"
          WORKFLOW_PATH="${WORKFLOW_PATH#*/}"         # strip "repo/"
          WORKFLOW_PATH="${WORKFLOW_PATH%@*}"         # strip "@ref"

          WORKFLOWS=$(yq -o=json -I=0 '.on.workflow_run.workflows' "$WORKFLOW_PATH")
          echo "list=$WORKFLOWS" >> $GITHUB_OUTPUT

      - name: Check all workflow dependencies status
        id: check_deps
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPENDENCIES: ${{ steps.workflow_dependencies.outputs.list }}
        # Outputs: all_completed, all_passed, workflow_statuses
        run: bun .github/scripts/check-workflow-dependencies.ts

  trigger-chained-workflow:
    needs: check-workflow-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Trigger workflow
        # Replace "all_completed" with "all_passed" if you only want to trigger
        # the workflow if all dependencies passed (green CI)
        if: needs.check-workflow-dependencies.outputs.all_completed == 'true'
        run: |
          echo "Triggering workflow for target commit: ${{ github.event.workflow_run.head_sha }}"
          gh workflow run chained_workflow.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref=${{ github.event.workflow_run.head_branch }}
        env:
          GH_TOKEN: ${{ github.token }}
